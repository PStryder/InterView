name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency health
        run: python -m pip check

      - name: Compile check
        run: python -m compileall -q src/interview

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy src/interview

      # --no-cov because pyproject applies --cov-fail-under to every pytest
      # invocation, so this single-file contract check was also enforcing a
      # package-wide coverage floor and failing at 39%. Coverage is gated by
      # the full run below, where it belongs.
      - name: Validate MCP tool snapshot
        run: pytest tests/test_mcp_snapshot.py --no-cov

      - name: Run tests
        run: pytest
