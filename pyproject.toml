[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview"
version = "0.1.0"
description = "Read-Only System Viewer Surfaces for LegiVellum Meshes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.28.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interview"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/interview"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
disallow_incomplete_defs = false
allow_redefinition = true
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
addopts = "-q --maxfail=1 --cov=interview --cov-report=term-missing --cov-fail-under=20"
testpaths = ["tests"]
